name: test

# Linux only, on the lowest Node the package declares (18) and the newest (22). A macOS runner bills ten
# minutes for each minute it runs and the project has no dependencies, so a macOS job would cost most of the
# account's Actions quota for little. A push to a branch with a pull request open runs once, not twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step: the project has no dependencies.
      # The suites run against a throwaway HOME. bin/check-config.js is not run
      # here: it inspects the real ~/.claude of the machine it runs on, which a
      # CI runner does not have, so it would only report "absent".
      - run: npm test
